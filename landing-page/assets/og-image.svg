  <text x="76" y="255" fill="#17241f" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-3">Keep coding-agent</text>
  <text x="76" y="332" fill="#17241f" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-3">context <tspan fill="#78aa3e">lean.</tspan></text>
  <text x="80" y="387" fill="#64736a" font-family="Arial, Helvetica, sans-serif" font-size="22">Local command pruning. Lightweight source outlines.</text>
  <text x="80" y="420" fill="#64736a" font-family="Arial, Helvetica, sans-serif" font-size="22">No proxy. No model calls. Just less noise.</text>
