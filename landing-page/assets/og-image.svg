<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="120" y1="30" x2="1090" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8faf5"/>
      <stop offset="1" stop-color="#eaf1e5"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d0f291"/>
      <stop offset="1" stop-color="#8ec94b"/>
    </linearGradient>
    <filter id="shadow" x="606" y="146" width="532" height="369" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
