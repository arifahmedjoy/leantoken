name: LeanToken CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Latency Benchmark
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Check changelog entry for package version
      run: node scripts/changelog.js --check

    - name: Run Unit Tests
      run: node test/runner.js

    - name: Run Latency SLA Benchmark
      run: node test/benchmark.js

  changelog:
    name: Changelog updated with code changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Code changes need a CHANGELOG.md entry
      run: |
        CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
        echo "$CHANGED"
        if echo "$CHANGED" | grep -qE '^(src|bin)/' && ! echo "$CHANGED" | grep -qx 'CHANGELOG.md'; then
          echo "::error::src/ or bin/ changed but CHANGELOG.md did not. Add an entry under ## [Unreleased] (and update ROADMAP.md / docs if status or behavior changed)."
          exit 1
        fi
